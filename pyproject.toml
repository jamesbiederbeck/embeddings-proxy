[project]
name = "embeddings-proxy"
version = "0.5.2"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "httpx>=0.27,<0.28",
    "redis>=5,<6",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
qdrant = [
    "qdrant-client>=1.10,<2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "fakeredis>=2.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
